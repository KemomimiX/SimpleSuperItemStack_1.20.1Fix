name: Build SSIS 1.20.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Forge Jar
        run: ./gradlew :forge:jar --no-daemon

      - name: Find generated JARs
        run: |
          echo "=== Generated JARs ==="
          find . -type f -name "*.jar" -print

          echo "=== Build directories ==="
          find . -type d -name build -print

      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: ssis-forge-1.20.1
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
