
name: Build SSIS 1.20.1

on:
  push:
    branches:
      - 1.20.1
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build Forge
        run: ./gradlew :forge:build --no-daemon

      - name: Show built files
        run: |
          echo "=== Forge libs ==="
          ls -lh forge/build/libs || true
          echo "=== Common libs ==="
          ls -lh common/build/libs || true

      - name: Upload Forge Jar
        uses: actions/upload-artifact@v4
        with:
          name: ssis-forge-1.20.1
          path: forge/build/libs/*.jar
